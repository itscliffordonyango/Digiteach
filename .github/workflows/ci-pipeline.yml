name: Team CI Pipeline

on:
  push:
    branches: [ main ]
  # Triggers on PRs from both internal team members and external forks
  pull_request:
    branches: [ main ]

# Grants minimum secure permissions required for checking out code
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 🚀 AUTOMATIC CACHING: Speeds up builds for everyone by skipping 
          # npm install download times if package-lock.json hasn't changed.
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ✨ LINTING: Forces a unified code style so contributors don't fight over formatting
      - name: Run Code Linter
        run: npm run lint
        continue-on-error: false

      - name: Run tests
        run: npm test
